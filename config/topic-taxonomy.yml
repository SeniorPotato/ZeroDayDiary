publish_gate:
  mode: warn-and-escalate
  description: >
    Guards are editorial prompts, not rigid blockers. High-confidence major stories should still publish
    even when category balance is imperfect.
  guards:
    - id: guard-high-impact-visibility
      description: Warn if no high-impact security story appeared in the last 24h.
      type: warn
      patterns:
        - source code leak
        - source code theft
        - supply chain
        - npm malware
        - major breach
        - phishing
        - actively exploited
        - ransomware
        - wiper

    - id: guard-ai-risk-every-48h
      description: Warn if no AI-risk or AI-governance item was covered in the last 48h.
      type: warn
      patterns:
        - prompt injection
        - ai exploit
        - ai governance
        - ai act
        - deepfake
        - model data leak

scoring:
  description: Composite editorial score used for ranking, not absolute truth.
  factors:
    tier_weight:
      tier_1: 40
      tier_2: 25
      tier_3: 10
    source_credibility:
      primary_vendor_advisory: 20
      government_agency: 20
      established_security_media: 15
      reputable_research_org: 15
      industry_blog: 10
      aggregator_or_forum: 5
    recency:
      under_6h: 20
      from_6h_to_12h: 15
      from_12h_to_24h: 10
      from_24h_to_48h: 5
      over_48h: 0
    novelty:
      new_story: 15
      significant_update: 10
      minor_update: 5
      already_covered: 0
  disqualifiers:
    - description: already published recently with no material update
      action: discard
    - description: forum-only claim with no corroborating source
      action: hold_for_review
    - description: weakly matched item with low extraction quality
      action: hold_for_review
