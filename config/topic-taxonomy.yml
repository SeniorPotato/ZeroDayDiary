# ZeroDayDiary — Topic Taxonomy & Editorial Scoring
# Amended for the live ZeroDayDiary workflow.
# This file is advisory for ranking, prioritisation, and review prompts.
# It does NOT by itself add monitored sources or guarantee ingestion.

metadata:
  version: 1.1.0
  publish_cycle_hours: 12
  min_score_to_queue: 55
  min_score_to_auto_publish: 75
  max_items_per_cycle: 6
  scoring_mode: advisory
  notes:
    - Source hints are editorial guidance, not automatic source registration.
    - Quiet cycles are allowed; the pipeline should not invent filler just to satisfy taxonomy targets.
    - High-impact security stories should bias toward publish even if extraction or metadata is imperfect.

rolling_balance:
  target_categories_per_48h:
    security: 3
    governance: 1
    privacy: 1
    ai-risk: 1
  warnings_only: true

topics:
  - id: supply-chain-compromise
    label: Supply-chain compromise
    category: security
    tier: 1
    score_boost: 25
    staleness_hours: 24
    publish_bias: auto
    keywords:
      - npm malware
      - pypi malware
      - malicious package
      - dependency confusion
      - source code theft
      - source code leak
      - compromised dependency
      - poisoned release
      - package hijack
      - supply chain attack
      - compromised maintainer
    source_hints:
      - socket.dev
      - openssf.org
      - github.com/advisories
      - snyk.io/blog
      - stepsecurity.io

  - id: exploited-vulnerability
    label: Actively exploited vulnerability
    category: security
    tier: 1
    score_boost: 25
    staleness_hours: 24
