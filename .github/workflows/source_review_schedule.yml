name: Source Review Cadence

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log-review-window:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Append scheduled review entry
        shell: bash
        run: |
          NOW=$(date -u +"%Y-%m-%d %H:%M UTC")
          mkdir -p data/monitoring
          touch data/monitoring/review-log.md
          cat <<EOF >> data/monitoring/review-log.md

- **Timestamp:** ${NOW}
- **Reviewer:** scheduled workflow
- **Sources checked:** review window opened for Tier 1 source pass
- **Result:** review due
- **Notes:** Scheduled 4-hour review window triggered. Complete manual/editorial source pass and replace this placeholder outcome with the real result when acted on.
EOF

      - name: Commit review heartbeat
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(monitoring): log 4-hour source review window"
          file_pattern: data/monitoring/review-log.md
