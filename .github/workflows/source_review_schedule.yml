name: Source Review Cadence

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ANTHROPIC_REVIEW_MODEL: ${{ vars.ANTHROPIC_REVIEW_MODEL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  review-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Run source review
        run: npm run monitor:review

      - name: Publish qualifying candidates
        run: npm run monitor:publish

      - name: Validate Anthropic review configuration
        if: ${{ env.ANTHROPIC_REVIEW_MODEL != '' || env.ANTHROPIC_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANTHROPIC_REVIEW_MODEL}" || -z "${ANTHROPIC_API_KEY}" ]]; then
            echo "Anthropic review config is incomplete: set both ANTHROPIC_REVIEW_MODEL and ANTHROPIC_API_KEY." >&2
            exit 1
          fi
          if [[ "${ANTHROPIC_REVIEW_MODEL}" != claude* && "${ANTHROPIC_REVIEW_MODEL}" != anthropic/* ]]; then
            echo "ANTHROPIC_REVIEW_MODEL must be an Anthropic Claude model name or anthropic/* alias." >&2
            exit 1
          fi

      - name: Review generated posts with Anthropic editorial pass
        if: ${{ env.ANTHROPIC_REVIEW_MODEL != '' && env.ANTHROPIC_API_KEY != '' }}
        run: npm run monitor:review-published

      - name: Validate site build
        uses: ./.github/actions/validate-site

      - name: Create or update monitoring review pull request
        uses: ./.github/actions/create-automation-pr
        with:
          commit-message: "chore(monitoring): run scheduled source review"
          title: "chore(monitoring): scheduled source review"
          body-file: .github/source-review-pr-body.md
          branch: automation/source-review
