name: Source Review Cadence

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
    inputs:
      publish_candidates:
        description: 'Publish qualifying candidates during this run'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      auto_merge:
        description: 'Automatically merge the generated monitoring PR after checks pass'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ANTHROPIC_REVIEW_MODEL: ${{ vars.ANTHROPIC_REVIEW_MODEL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  review-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Run source review
        run: npm run monitor:review

      - name: Publish qualifying candidates
        if: ${{ github.event_name == 'schedule' || inputs.publish_candidates == 'true' }}
        run: npm run monitor:publish

      - name: Validate Anthropic review configuration
        if: ${{ (github.event_name == 'schedule' || inputs.publish_candidates == 'true') && (env.ANTHROPIC_REVIEW_MODEL != '' || env.ANTHROPIC_API_KEY != '') }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANTHROPIC_REVIEW_MODEL}" || -z "${ANTHROPIC_API_KEY}" ]]; then
            echo "Anthropic review config is incomplete: set both ANTHROPIC_REVIEW_MODEL and ANTHROPIC_API_KEY." >&2
            exit 1
          fi
          if [[ "${ANTHROPIC_REVIEW_MODEL}" != claude* && "${ANTHROPIC_REVIEW_MODEL}" != anthropic/* ]]; then
            echo "ANTHROPIC_REVIEW_MODEL must be an Anthropic Claude model name or anthropic/* alias." >&2
            exit 1
          fi

      - name: Review generated posts with Anthropic editorial pass
        if: ${{ (github.event_name == 'schedule' || inputs.publish_candidates == 'true') && env.ANTHROPIC_REVIEW_MODEL != '' && env.ANTHROPIC_API_KEY != '' }}
        run: npm run monitor:review-published

      - name: Validate site build
        uses: ./.github/actions/validate-site

      - name: Create or update monitoring review pull request
        id: monitoring-pr
        uses: ./.github/actions/create-automation-pr
        with:
          commit-message: "chore(monitoring): run automated source review"
          title: "chore(monitoring): automated source review"
          body-file: .github/source-review-pr-body.md
          branch: automation/source-review

      - name: Enable auto-merge for monitoring pull request
        if: ${{ steps.monitoring-pr.outputs.pull-request-number != '' && (github.event_name == 'schedule' || inputs.auto_merge == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.monitoring-pr.outputs.pull-request-url }}
        shell: bash
        run: |
          set -euo pipefail
          if output="$(gh pr merge --auto --squash --delete-branch "$PR_URL" 2>&1)"; then
            printf '%s\n' "$output"
            exit 0
          fi

          printf '%s\n' "$output" >&2
          if [[ "$output" == *"Protected branch rules not configured for this branch"* ]]; then
            echo "Auto-merge requires a protected base branch; merging the validated monitoring PR directly." >&2
            gh pr merge --squash --delete-branch "$PR_URL"
          else
            exit 1
          fi
