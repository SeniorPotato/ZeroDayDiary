name: Source Review Cadence

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ANTHROPIC_REVIEW_MODEL: ${{ vars.ANTHROPIC_REVIEW_MODEL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  review-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source review
        run: npm run monitor:review

      - name: Publish qualifying candidates
        run: npm run monitor:publish

      - name: Validate Anthropic review configuration
        if: ${{ env.ANTHROPIC_REVIEW_MODEL != '' || env.ANTHROPIC_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANTHROPIC_REVIEW_MODEL}" || -z "${ANTHROPIC_API_KEY}" ]]; then
            echo "Anthropic review config is incomplete: set both ANTHROPIC_REVIEW_MODEL and ANTHROPIC_API_KEY." >&2
            exit 1
          fi
          if [[ "${ANTHROPIC_REVIEW_MODEL}" != claude* && "${ANTHROPIC_REVIEW_MODEL}" != anthropic/* ]]; then
            echo "ANTHROPIC_REVIEW_MODEL must be an Anthropic Claude model name or anthropic/* alias." >&2
            exit 1
          fi

      - name: Review generated posts with Anthropic editorial pass
        if: ${{ env.ANTHROPIC_REVIEW_MODEL != '' && env.ANTHROPIC_API_KEY != '' }}
        run: npm run monitor:review-published

      - name: Build site
        run: npm run build

      - name: Create monitoring review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(monitoring): run scheduled source review"
          title: "chore(monitoring): scheduled source review"
          body: |
            Automated monitoring run completed and passed validation.

            Safeguards applied:
            - source discovery and extraction run inside repository scripts
            - generated markdown must pass structural validation before any overwrite
            - AI revisions fail closed on malformed frontmatter/body
            - Astro build must pass before this PR is created
            - changes are proposed as a PR for review instead of pushing directly to main

            Review focus:
            - confirm candidate quality and editorial fit
            - verify generated posts read cleanly
            - merge only after normal repository review
          branch: "automation/source-review-${{ github.run_id }}"
          delete-branch: true
