name: Source Review Cadence

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run source review
        run: node scripts/monitoring/review-sources.mjs

      - name: Commit review outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(monitoring): run scheduled source review"
          file_pattern: |
            data/monitoring/intake.md
            data/monitoring/review-log.md
            data/monitoring/review-packets/*.md
            data/monitoring/state/source-review-state.json
