name: Source Review Cadence

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
    inputs:
      publish_candidates:
        description: 'Publish qualifying candidates after source review'
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ANTHROPIC_REVIEW_MODEL: ${{ vars.ANTHROPIC_REVIEW_MODEL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  review-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source review
        run: npm run monitor:review

      - name: Publish qualifying candidates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_candidates }}
        run: npm run monitor:publish

      - name: Validate Anthropic review configuration
        if: ${{ env.ANTHROPIC_REVIEW_MODEL != '' || env.ANTHROPIC_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANTHROPIC_REVIEW_MODEL}" || -z "${ANTHROPIC_API_KEY}" ]]; then
            echo "Anthropic review config is incomplete: set both ANTHROPIC_REVIEW_MODEL and ANTHROPIC_API_KEY." >&2
            exit 1
          fi
          if [[ "${ANTHROPIC_REVIEW_MODEL}" != claude* && "${ANTHROPIC_REVIEW_MODEL}" != anthropic/* ]]; then
            echo "ANTHROPIC_REVIEW_MODEL must be an Anthropic Claude model name or anthropic/* alias." >&2
            exit 1
          fi

      - name: Review generated posts with Anthropic editorial pass
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_candidates && env.ANTHROPIC_REVIEW_MODEL != '' && env.ANTHROPIC_API_KEY != '' }}
        run: npm run monitor:review-published

      - name: Build site
        run: npm run build

      - name: Commit monitoring changes
        id: commit_changes
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/source-review"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(monitoring): run scheduled source review"
          git push --force-with-lease origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create or update monitoring review pull request
        id: cpr
        if: steps.commit_changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ steps.commit_changes.outputs.branch }}"
          BODY_FILE=".github/source-review-pr-body.md"
          EXISTING_PR="$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [[ -n "$EXISTING_PR" ]]; then
            gh pr edit "$EXISTING_PR" \
              --title "chore(monitoring): scheduled source review" \
              --body-file "$BODY_FILE"
            echo "pull-request-number=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          else
            PR_URL="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(monitoring): scheduled source review" \
              --body-file "$BODY_FILE")"
            gh pr view "$PR_URL" --json number --jq '"pull-request-number=" + (.number|tostring)' >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-number
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" \
            --squash \
            --delete-branch \
            --body "Auto-merged by workflow after validation"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
