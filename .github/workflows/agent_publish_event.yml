name: Agent Publish Event Draft

on:
  workflow_dispatch:
    inputs:
      title:
        description: Event title
        required: true
        type: string
      slug:
        description: URL slug
        required: true
        type: string
      description:
        description: Standfirst / summary
        required: true
        type: string
      tags:
        description: Comma-separated tags
        required: true
        type: string
      draft:
        description: Keep as draft
        required: true
        default: true
        type: boolean
      overview:
        description: What happened / overview section
        required: true
        type: string
      why_it_matters:
        description: Why it matters section
        required: true
        type: string
      analysis:
        description: Analysis section
        required: true
        type: string
      further_reading:
        description: Further reading section
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-event-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create validated event markdown draft
        env:
          DRAFT_MODE: event
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_DESCRIPTION: ${{ inputs.description }}
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_OVERVIEW: ${{ inputs.overview }}
          INPUT_WHY_IT_MATTERS: ${{ inputs.why_it_matters }}
          INPUT_ANALYSIS: ${{ inputs.analysis }}
          INPUT_FURTHER_READING: ${{ inputs.further_reading }}
        run: npm run draft:agent

      - name: Build site for validation
        run: npm run build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "feat(event): add ${{ inputs.slug }} draft"
          title: "feat(event): add ${{ inputs.title }}"
          body: |
            Agent-generated event draft, validated before PR creation.

            Safeguards applied:
            - input rendered through the repository draft generator rather than shell heredoc interpolation
            - markdown/frontmatter validated before write
            - full Astro build completed before PR creation

            Draft details:
            - Title: ${{ inputs.title }}
            - Slug: ${{ inputs.slug }}
            - Draft: ${{ inputs.draft }}
          branch: "feat/event-${{ inputs.slug }}"
          delete-branch: true
