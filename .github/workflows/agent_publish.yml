name: Agent Publish Post

on:
  workflow_dispatch:
    inputs:
      title:
        description: Post title
        required: true
        type: string
      slug:
        description: URL slug
        required: true
        type: string
      description:
        description: Short description
        required: true
        type: string
      tags:
        description: Comma-separated tags
        required: true
        type: string
      draft:
        description: Keep as draft
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  create-post-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create validated markdown post draft
        env:
          DRAFT_MODE: post
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_DESCRIPTION: ${{ inputs.description }}
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: npm run draft:agent

      - name: Build site for validation
        run: npm run build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "feat(content): add ${{ inputs.slug }} draft"
          title: "feat(content): add ${{ inputs.title }}"
          body: |
            Agent-generated content draft, validated before PR creation.

            Safeguards applied:
            - input rendered through the repository draft generator rather than shell heredoc interpolation
            - markdown/frontmatter validated before write
            - full Astro build completed before PR creation

            Draft details:
            - Title: ${{ inputs.title }}
            - Slug: ${{ inputs.slug }}
            - Draft: ${{ inputs.draft }}
          branch: "feat/agent-publish-${{ inputs.slug }}"
          delete-branch: true
