name: Agent Publish Post

on:
  workflow_dispatch:
    inputs:
      title:
        description: Post title
        required: true
        type: string
      slug:
        description: URL slug
        required: true
        type: string
      description:
        description: Short description
        required: true
        type: string
      tags:
        description: Comma-separated tags
        required: true
        type: string
      draft:
        description: Keep as draft
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  create-post-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create markdown post
        shell: bash
        run: |
          DATE=$(date +%F)
          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          mkdir -p src/content/blog/$YEAR/$MONTH
          FILE="src/content/blog/$YEAR/$MONTH/${{ inputs.slug }}.md"
          TAGS=$(printf '%s' "${{ inputs.tags }}" | awk -F',' '{printf("[\n"); for(i=1;i<=NF;i++) printf("  \"%s\"%s\n", $i, i<NF ? "," : ""); printf("]\n")}')
          cat > "$FILE" <<EOF
          ---
          title: "${{ inputs.title }}"
          description: "${{ inputs.description }}"
          pubDate: $DATE
          draft: ${{ inputs.draft }}
          tags: $TAGS
          canonical: "https://zerodaydiary.com/blog/${{ inputs.slug }}/"
          ---

          Write article content here.
          EOF

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "feat(content): add ${{ inputs.slug }} draft"
          title: "feat(content): add ${{ inputs.title }}"
          body: |
            Agent-generated content draft.

            - Title: ${{ inputs.title }}
            - Slug: ${{ inputs.slug }}
            - Draft: ${{ inputs.draft }}
          branch: "feat/agent-publish-${{ inputs.slug }}"
          delete-branch: true
