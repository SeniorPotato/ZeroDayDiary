name: Setup Node dependencies
description: Checkout-independent Node setup and npm dependency installation for repository workflows.
inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '20'
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci
