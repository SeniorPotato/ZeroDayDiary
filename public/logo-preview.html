<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroDayDiary Logo Concepts</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #070a12;
      color: #f8fafc;
      padding: 32px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 28px;
    }
    .grid {
      display: grid;
      gap: 24px;
    }
    .card {
      background: linear-gradient(180deg, rgba(15,23,42,.92), rgba(15,23,42,.72));
      border: 1px solid rgba(148,163,184,.14);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 18px 44px rgba(2,6,23,.25);
    }
    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .18em;
      color: #67e8f9;
      margin-bottom: 12px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      background: #0b1120;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>ZeroDayDiary logo concepts</h1>
  <div class="grid">
    <div class="card">
      <div class="label">1. Editorial intelligence</div>
      <img src="/logo-concept-editorial-intelligence.svg" alt="Editorial intelligence logo concept" />
    </div>
    <div class="card">
      <div class="label">2. Minimal security journal</div>
      <img src="/logo-concept-minimal-security-journal.svg" alt="Minimal security journal logo concept" />
    </div>
    <div class="card">
      <div class="label">3. Technical monogram</div>
      <img src="/logo-concept-technical-monogram.svg" alt="Technical monogram logo concept" />
    </div>
  </div>
</body>
</html>
